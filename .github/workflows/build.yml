name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bin: mcrust.exe
          - name: linux-x64
            os: ubuntu-latest
            bin: mcrust
          - name: macos-arm64
            os: macos-latest
            bin: mcrust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked -p mcrust

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" dist/
          cp README.md dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcrust-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && chmod +x mcrust 2>/dev/null; zip -r "../$name.zip" .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
